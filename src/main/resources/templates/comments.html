<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: document('comments', '댓글', ~{::content})}">
<body>
<div th:fragment="content">
    <!-- 검색 -->
    <form method="get" th:action="@{/comments}" class="mb-4 flex gap-2">
        <input type="text" name="q" th:value="${q}" placeholder="content 검색"
               class="border rounded px-3 py-2 text-sm w-72" />
        <input type="hidden" name="size" th:value="${page.size}" />
        <button type="submit" class="bg-gray-900 text-white text-sm px-4 py-2 rounded">검색</button>
        <a th:href="@{/comments}" class="text-sm px-4 py-2 rounded border">초기화</a>
    </form>

    <div class="bg-white rounded-lg border overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-left">
            <tr>
                <th class="px-4 py-2">commentNo</th>
                <th class="px-4 py-2">작성자</th>
                <th class="px-4 py-2">reviewNo</th>
                <th class="px-4 py-2">content</th>
                <th class="px-4 py-2">status</th>
                <th class="px-4 py-2">createdAt</th>
                <th class="px-4 py-2">액션</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${page.content}" class="border-t" th:with="c=${row.comment}">
                <td class="px-4 py-2" th:text="${c.commentNo}">-</td>
                <td class="px-4 py-2" th:text="${row.authorNickname}">-</td>
                <td class="px-4 py-2" th:text="${row.reviewNo}">-</td>
                <td class="px-4 py-2 text-gray-600 max-w-md" th:text="${row.preview}">-</td>
                <td class="px-4 py-2">
                    <span th:replace="~{fragments :: statusBadge(${c.status})}"></span>
                </td>
                <td class="px-4 py-2 text-gray-500"
                    th:text="${c.createdAt != null} ? ${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                <td class="px-4 py-2">
                    <button type="button"
                            class="js-toggle-status text-xs px-3 py-1 rounded border hover:bg-gray-100"
                            th:attr="data-type='comments', data-id=${c.id}">상태 토글</button>
                </td>
            </tr>
            <tr th:if="${page.isEmpty()}">
                <td colspan="7" class="px-4 py-8 text-center text-gray-400">데이터 없음</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments :: pagination(${page}, '/comments', ${q})}"></div>
</div>
</body>
</html>
