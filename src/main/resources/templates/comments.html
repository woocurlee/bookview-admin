<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: document('comments', '댓글', ~{::content})}">
<body>
<div th:fragment="content">
    <!-- 검색 -->
    <form method="get" th:action="@{/comments}" class="mb-4 flex gap-2 items-center">
        <div class="relative">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" name="q" th:value="${q}" placeholder="댓글 내용으로 검색" autocomplete="off"
                   class="border rounded-lg pl-9 pr-4 py-2 text-sm w-72 focus:outline-none focus:ring-2 focus:ring-gray-300" />
        </div>
        <select name="status" class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-300 text-gray-700">
            <option value="" th:selected="${#strings.isEmpty(status)}">전체</option>
            <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">활성</option>
            <option value="BLOCK" th:selected="${status == 'BLOCK'}">차단</option>
            <option value="DELETED" th:selected="${status == 'DELETED'}">삭제</option>
        </select>
        <input type="hidden" name="size" th:value="${page.size}" />
        <button type="submit" class="bg-gray-900 text-white text-sm px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors">검색</button>
        <a th:href="@{/comments}" class="text-sm px-4 py-2 rounded-lg border hover:bg-gray-50 transition-colors text-gray-600">초기화</a>
    </form>

    <div class="bg-white rounded-lg border overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-left">
            <tr>
                <th class="px-4 py-2 w-16 whitespace-nowrap">번호</th>
                <th class="px-4 py-2 w-28 whitespace-nowrap">작성자</th>
                <th class="px-4 py-2 w-24 whitespace-nowrap">리뷰 번호</th>
                <th class="px-4 py-2 whitespace-nowrap">내용</th>
                <th class="px-4 py-2 w-20 whitespace-nowrap">상태</th>
                <th class="px-4 py-2 w-36 whitespace-nowrap">작성일</th>
                <th class="px-4 py-2 w-20 whitespace-nowrap">액션</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${page.content}" class="border-t" th:with="c=${row.comment}">
                <td class="px-4 py-2" th:text="${c.commentNo}">-</td>
                <td class="px-4 py-2" th:text="${row.authorNickname}">-</td>
                <td class="px-4 py-2" th:text="${row.reviewNo}">-</td>
                <td class="px-4 py-2 text-gray-600 max-w-md" th:text="${row.preview}">-</td>
                <td class="px-4 py-2">
                    <span th:replace="~{fragments :: statusBadge(${c.status})}"></span>
                </td>
                <td class="px-4 py-2 text-gray-500"
                    th:text="${c.createdAt != null} ? ${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                <td class="px-4 py-2">
                    <button th:if="${c.status.name() != 'DELETED'}" type="button"
                            class="js-block-action text-xs px-3 py-1 rounded border hover:bg-gray-100"
                            th:attr="data-type='comments', data-id=${c.id}, data-status=${c.status}"
                            th:text="${c.status.name() == 'ACTIVE'} ? '차단' : '차단 해제'">차단</button>
                </td>
            </tr>
            <tr th:if="${page.isEmpty()}">
                <td colspan="7" class="px-4 py-8 text-center text-gray-400">데이터 없음</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments :: pagination(${page}, '/comments', ${q}, ${status})}"></div>
</div>
</body>
</html>
