<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: document('users', '유저', ~{::content})}">
<body>
<div th:fragment="content">
    <!-- 검색 -->
    <form method="get" th:action="@{/users}" class="mb-4 flex gap-2 items-center">
        <div class="relative">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" name="q" th:value="${q}" placeholder="닉네임 또는 이메일로 검색" autocomplete="off"
                   class="border rounded-lg pl-9 pr-4 py-2 text-sm w-72 focus:outline-none focus:ring-2 focus:ring-gray-300" />
        </div>
        <input type="hidden" name="size" th:value="${page.size}" />
        <button type="submit" class="bg-gray-900 text-white text-sm px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors">검색</button>
        <a th:href="@{/users}" class="text-sm px-4 py-2 rounded-lg border hover:bg-gray-50 transition-colors text-gray-600">초기화</a>
    </form>

    <div class="bg-white rounded-lg border overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-left">
            <tr>
                <th class="px-4 py-2 w-16 whitespace-nowrap">번호</th>
                <th class="px-4 py-2 w-32 whitespace-nowrap">닉네임</th>
                <th class="px-4 py-2 whitespace-nowrap">이메일</th>
                <th class="px-4 py-2 w-20 whitespace-nowrap">상태</th>
                <th class="px-4 py-2 w-36 whitespace-nowrap">가입일</th>
                <th class="px-4 py-2 w-36 whitespace-nowrap">마지막 로그인</th>
                <th class="px-4 py-2 w-20 whitespace-nowrap">액션</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${page.content}" class="border-t" th:attr="data-row=${u.id}">
                <td class="px-4 py-2" th:text="${u.userNo}">-</td>
                <td class="px-4 py-2" th:text="${u.nickname}">-</td>
                <td class="px-4 py-2 text-gray-500" th:text="${u.email}">-</td>
                <td class="px-4 py-2">
                    <span th:replace="~{fragments :: statusBadge(${u.status})}"></span>
                </td>
                <td class="px-4 py-2 text-gray-500"
                    th:text="${u.createdAt != null} ? ${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                <td class="px-4 py-2 text-gray-500"
                    th:text="${u.lastLoginAt != null} ? ${#temporals.format(u.lastLoginAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                <td class="px-4 py-2">
                    <button th:if="${u.status.name() != 'DELETED'}" type="button"
                            class="js-block-action text-xs px-3 py-1 rounded border hover:bg-gray-100"
                            th:attr="data-type='users', data-id=${u.id}, data-status=${u.status}"
                            th:text="${u.status.name() == 'ACTIVE'} ? '차단' : '차단 해제'">차단</button>
                </td>
            </tr>
            <tr th:if="${page.isEmpty()}">
                <td colspan="7" class="px-4 py-8 text-center text-gray-400">데이터 없음</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments :: pagination(${page}, '/users', ${q}, '')}"></div>
</div>
</body>
</html>
