<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: document('users', '유저', ~{::content})}">
<body>
<div th:fragment="content">
    <!-- 검색 -->
    <form method="get" th:action="@{/users}" class="mb-4 flex gap-2">
        <input type="text" name="q" th:value="${q}" placeholder="nickname 또는 email 검색"
               class="border rounded px-3 py-2 text-sm w-72" />
        <input type="hidden" name="size" th:value="${page.size}" />
        <button type="submit" class="bg-gray-900 text-white text-sm px-4 py-2 rounded">검색</button>
        <a th:href="@{/users}" class="text-sm px-4 py-2 rounded border">초기화</a>
    </form>

    <div class="bg-white rounded-lg border overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-left">
            <tr>
                <th class="px-4 py-2">userNo</th>
                <th class="px-4 py-2">nickname</th>
                <th class="px-4 py-2">email</th>
                <th class="px-4 py-2">status</th>
                <th class="px-4 py-2">createdAt</th>
                <th class="px-4 py-2">lastLoginAt</th>
                <th class="px-4 py-2">액션</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${page.content}" class="border-t" th:attr="data-row=${u.id}">
                <td class="px-4 py-2" th:text="${u.userNo}">-</td>
                <td class="px-4 py-2" th:text="${u.nickname}">-</td>
                <td class="px-4 py-2 text-gray-500" th:text="${u.email}">-</td>
                <td class="px-4 py-2">
                    <span th:replace="~{fragments :: statusBadge(${u.status})}"></span>
                </td>
                <td class="px-4 py-2 text-gray-500"
                    th:text="${u.createdAt != null} ? ${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                <td class="px-4 py-2 text-gray-500"
                    th:text="${u.lastLoginAt != null} ? ${#temporals.format(u.lastLoginAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                <td class="px-4 py-2">
                    <button type="button"
                            class="js-toggle-status text-xs px-3 py-1 rounded border hover:bg-gray-100"
                            th:attr="data-type='users', data-id=${u.id}">상태 토글</button>
                </td>
            </tr>
            <tr th:if="${page.isEmpty()}">
                <td colspan="7" class="px-4 py-8 text-center text-gray-400">데이터 없음</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments :: pagination(${page}, '/users', ${q})}"></div>
</div>
</body>
</html>
