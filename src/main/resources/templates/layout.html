<!DOCTYPE html>
<!--
  공통 레이아웃: 좌측 사이드바 + 상단 breadcrumb.
  각 페이지는 th:replace="~{layout :: document('메뉴키', '제목', ~{::content})}" 로 본문을 끼워 넣는다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="document(active, crumb, content)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="'bookview admin · ' + ${crumb}">bookview admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
<div class="flex min-h-screen">
    <!-- 사이드바 -->
    <aside id="sidebar" class="w-56 shrink-0 bg-gray-900 text-gray-100 flex flex-col transition-all duration-200">
        <div class="px-5 py-4 text-lg font-bold border-b border-gray-700 whitespace-nowrap overflow-hidden">
            📚 <span class="sidebar-label">bookview <span class="text-gray-400 text-sm">admin</span></span>
        </div>
        <nav class="flex-1 px-2 py-3 space-y-1">
            <a th:href="@{/}"
               th:classappend="${active == 'dashboard'} ? 'bg-gray-700 text-white' : 'text-gray-300 hover:bg-gray-800'"
               class="flex items-center gap-2 px-3 py-2 rounded text-sm whitespace-nowrap overflow-hidden">
                <span class="shrink-0">📊</span><span class="sidebar-label">대시보드</span>
            </a>
            <a th:href="@{/users}"
               th:classappend="${active == 'users'} ? 'bg-gray-700 text-white' : 'text-gray-300 hover:bg-gray-800'"
               class="flex items-center gap-2 px-3 py-2 rounded text-sm whitespace-nowrap overflow-hidden">
                <span class="shrink-0">👤</span><span class="sidebar-label">유저</span>
            </a>
            <a th:href="@{/reviews}"
               th:classappend="${active == 'reviews'} ? 'bg-gray-700 text-white' : 'text-gray-300 hover:bg-gray-800'"
               class="flex items-center gap-2 px-3 py-2 rounded text-sm whitespace-nowrap overflow-hidden">
                <span class="shrink-0">📝</span><span class="sidebar-label">리뷰</span>
            </a>
            <a th:href="@{/comments}"
               th:classappend="${active == 'comments'} ? 'bg-gray-700 text-white' : 'text-gray-300 hover:bg-gray-800'"
               class="flex items-center gap-2 px-3 py-2 rounded text-sm whitespace-nowrap overflow-hidden">
                <span class="shrink-0">💬</span><span class="sidebar-label">댓글</span>
            </a>
        </nav>
    </aside>

    <!-- 본문 -->
    <div class="flex-1 flex flex-col min-w-0">
        <header class="bg-white border-b px-4 py-3 flex items-center gap-3">
            <!-- 사이드바 토글 버튼 -->
            <button id="sidebar-toggle" class="p-1.5 rounded hover:bg-gray-100 transition-colors text-gray-500" title="사이드바 접기/펼치기">
                <svg id="icon-collapse" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M11 19l-7-7 7-7M21 19l-7-7 7-7"/>
                </svg>
                <svg id="icon-expand" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M13 5l7 7-7 7M3 5l7 7-7 7"/>
                </svg>
            </button>
            <nav class="text-sm text-gray-500">
                <span>관리자</span>
                <span class="mx-1">/</span>
                <span class="text-gray-900 font-medium" th:text="${crumb}">페이지</span>
            </nav>
        </header>
        <main class="flex-1 p-6">
            <div th:replace="${content}">본문이 여기에 들어갑니다.</div>
        </main>
    </div>
</div>
<script src="/js/admin.js" defer></script>
</body>
</html>
