<!DOCTYPE html>
<!-- 페이지 간 공유하는 작은 조각들 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 상태 배지 -->
<span th:fragment="statusBadge(status)"
      th:classappend="${status.name() == 'ACTIVE'} ? 'bg-green-100 text-green-700' : (${status.name() == 'BLOCK'} ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700')"
      class="inline-block px-2 py-0.5 rounded text-xs font-medium"
      th:text="${status}">STATUS</span>

<!-- 페이징: 현재 page, 기준 경로 base, 검색어 q, 상태 status 를 받는다 -->
<div th:fragment="pagination(page, base, q, status)" class="mt-4 flex items-center justify-between text-sm">
    <div class="text-gray-500">
        <span th:text="${page.number + 1}">1</span> / <span th:text="${page.totalPages == 0 ? 1 : page.totalPages}">1</span> 페이지
        · 총 <span th:text="${page.totalElements}">0</span>건
    </div>
    <div class="flex gap-2">
        <a th:if="${!page.first}"
           th:href="@{${base}(q=${q}, status=${#strings.isEmpty(status) ? null : status}, page=${page.number - 1}, size=${page.size})}"
           class="px-3 py-1 rounded border hover:bg-gray-100">이전</a>
        <span th:unless="${!page.first}" class="px-3 py-1 rounded border text-gray-300">이전</span>

        <a th:if="${!page.last}"
           th:href="@{${base}(q=${q}, status=${#strings.isEmpty(status) ? null : status}, page=${page.number + 1}, size=${page.size})}"
           class="px-3 py-1 rounded border hover:bg-gray-100">다음</a>
        <span th:unless="${!page.last}" class="px-3 py-1 rounded border text-gray-300">다음</span>
    </div>
</div>

</body>
</html>
