<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: document('reviews', '리뷰', ~{::content})}">
<body>
<div th:fragment="content">
    <!-- 검색 -->
    <form method="get" th:action="@{/reviews}" class="mb-4 flex gap-2">
        <input type="text" name="q" th:value="${q}" placeholder="bookTitle 또는 bookAuthor 검색"
               class="border rounded px-3 py-2 text-sm w-72" />
        <input type="hidden" name="size" th:value="${page.size}" />
        <button type="submit" class="bg-gray-900 text-white text-sm px-4 py-2 rounded">검색</button>
        <a th:href="@{/reviews}" class="text-sm px-4 py-2 rounded border">초기화</a>
    </form>

    <div class="bg-white rounded-lg border overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-left">
            <tr>
                <th class="px-4 py-2">reviewNo</th>
                <th class="px-4 py-2">bookTitle</th>
                <th class="px-4 py-2">작성자</th>
                <th class="px-4 py-2">rating</th>
                <th class="px-4 py-2">likeCount</th>
                <th class="px-4 py-2">status</th>
                <th class="px-4 py-2">createdAt</th>
                <th class="px-4 py-2">액션</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${page.content}" class="border-t" th:with="r=${row.review}">
                <td class="px-4 py-2" th:text="${r.reviewNo}">-</td>
                <td class="px-4 py-2" th:text="${r.bookTitle}">-</td>
                <td class="px-4 py-2" th:text="${row.authorNickname}">-</td>
                <td class="px-4 py-2" th:text="${r.rating}">-</td>
                <td class="px-4 py-2" th:text="${r.likeCount}">-</td>
                <td class="px-4 py-2">
                    <span th:replace="~{fragments :: statusBadge(${r.status})}"></span>
                </td>
                <td class="px-4 py-2 text-gray-500"
                    th:text="${r.createdAt != null} ? ${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                <td class="px-4 py-2 whitespace-nowrap">
                    <button type="button"
                            class="js-toggle-status text-xs px-3 py-1 rounded border hover:bg-gray-100"
                            th:attr="data-type='reviews', data-id=${r.id}">상태 토글</button>
                    <a th:if="${r.reviewNo != null}"
                       th:href="${bookviewBaseUrl} + '/r/' + ${r.reviewNo}" target="_blank" rel="noopener"
                       class="text-xs px-3 py-1 rounded border hover:bg-gray-100 text-blue-600">원문 보기</a>
                </td>
            </tr>
            <tr th:if="${page.isEmpty()}">
                <td colspan="8" class="px-4 py-8 text-center text-gray-400">데이터 없음</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments :: pagination(${page}, '/reviews', ${q})}"></div>
</div>
</body>
</html>
