server:
  port: 8090 # bookview(8088)와 포트 분리

spring:
  application:
    name: bookview-admin
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017}
    database: bookview
  thymeleaf:
    cache: false

admin:
  allowed-cidr: 100.64.0.0/10 # Tailscale CGNAT 대역

bookview:
  base-url: ${BOOKVIEW_BASE_URL:http://localhost:8080} # 원문 보기 링크 기준 URL
